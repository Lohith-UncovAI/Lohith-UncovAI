<svg viewBox="0 0 600 240" xmlns="http://www.w3.org/2000/svg" width="600" height="240" role="img" aria-labelledby="title desc">
  <title id="title">{{DISPLAY_NAME}} — AI / ML Engineer</title>
  <desc id="desc">{{TAGLINE}}. {{EXPERIENCE_1_ROLE}} at {{EXPERIENCE_1_COMPANY}}. A quiet Gotham skyline and softly glowing bat signal.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="100%">
      <stop stop-color="#0b101c" />
      <stop offset="1" stop-color="#{{BG}}" />
    </linearGradient>
    <radialGradient id="signal-glow">
      <stop stop-color="#{{ACCENT}}" stop-opacity="0.18" />
      <stop offset="1" stop-color="#{{ACCENT}}" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="100%" x2="100%" y2="0">
      <stop stop-color="#{{ACCENT}}" stop-opacity="0" />
      <stop offset="1" stop-color="#{{ACCENT}}" stop-opacity="0.08" />
    </linearGradient>
    <clipPath id="frame"><rect width="600" height="240" rx="24" /></clipPath>
    <style>
      .ui { font-family: "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; letter-spacing: 1px; }
      .signal { opacity: 0.8; animation: signal-glow 18s ease-in-out infinite; }
      @keyframes signal-glow { 0%, 100% { opacity: 0.65; } 50% { opacity: 0.95; } }
      @media (prefers-reduced-motion: reduce) { .signal { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="240" fill="url(#sky)" />
    <!-- The only decorative motion stays behind the text. -->
    <g class="signal">
      <circle cx="476" cy="100" r="154" fill="url(#signal-glow)" />
      <path d="M390 240 L436 84 L516 124 Z" fill="url(#beam)" />
    </g>
    <g fill="#dce3f0" opacity="0.28">
      <circle cx="644" cy="44" r="1" /><circle cx="727" cy="30" r="1" />
      <circle cx="929" cy="62" r="1.2" /><circle cx="962" cy="143" r="1" />
    </g>
    <circle cx="476" cy="100" r="67" fill="none" stroke="#{{ACCENT}}" stroke-opacity="0.12" />
    <circle cx="476" cy="100" r="56" fill="#{{ACCENT}}" fill-opacity="0.08" stroke="#{{ACCENT}}" stroke-opacity="0.3" />
    <g transform="translate(476 96) scale(0.8)" fill="#{{ACCENT}}">
      <path d="M0 -11 L-6 -21 L-10 -12 C-18 -10 -29 -17 -43 -27 C-44 -9 -37 0 -27 5 C-20 9 -13 8 -8 5 C-5 12 -2 18 0 23 C2 18 5 12 8 5 C13 8 20 9 27 5 C37 0 44 -9 43 -27 C29 -17 18 -10 10 -12 L6 -21 Z" />
    </g>
    <g transform="translate(0 -160)" opacity="0.4">
    <!-- A static skyline gives the page atmosphere without competing effects. -->
    <path d="M0 400 V330 H38 V306 H68 V346 H104 V290 H134 V312 H170 V274 H210 V318 H248 V296 H284 V344 H322 V300 H356 V272 H392 V314 H432 V282 H464 V400 Z" fill="#101522" />
    <path d="M546 400 V326 H580 V292 H616 V320 H648 V264 H674 V244 H692 V264 H716 V310 H744 V286 H782 V322 H816 V274 H850 V300 H882 V254 H918 V318 H954 V290 H1000 V400 Z" fill="#111724" />
    <path d="M0 400 V362 H72 V336 H118 V374 H168 V344 H226 V362 H282 V328 H324 V368 H384 V340 H424 V376 H498 V354 H552 V374 H616 V344 H666 V364 H724 V332 H772 V374 H832 V348 H882 V364 H944 V340 H1000 V400 Z" fill="#080c14" />
    <g fill="#{{ACCENT}}" opacity="0.3">
      <rect x="180" y="289" width="3" height="5" /><rect x="366" y="285" width="3" height="5" />
      <rect x="662" y="278" width="3" height="5" /><rect x="898" y="270" width="3" height="5" />
      <rect x="860" y="317" width="3" height="5" />
    </g>
    </g>
    <rect x="30" y="30" width="32" height="3" rx="1.5" fill="#{{ACCENT}}" />
    <text x="30" y="66" class="mono" fill="#{{ACCENT}}" font-size="14">AI / ML ENGINEER</text>
    <text x="27" y="136" class="ui" fill="#{{TEXT}}" font-size="64" font-weight="700" letter-spacing="-3">{{DISPLAY_NAME}}</text>
    <text x="30" y="187" class="ui" fill="#bcc5d6" font-size="21">GenAI · MLOps · Hybrid Cloud</text>
  </g>
  <rect x="0.5" y="0.5" width="599" height="239" rx="24" fill="none" stroke="#242c3b" />
</svg>
